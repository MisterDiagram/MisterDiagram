name: ci

# Quality gates for every push to master and every pull request: rustfmt, clippy (-D warnings),
# tests, render, asset attribution, crate layering, source citations and the wasm32 check, which is
# `cargo xtask ci`. Corpus-dependent gates skip on the runners because the private corpus is
# absent; they run locally and in the acceptance records (docs/development.md).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISTERDIAGRAM_REQUIRE_PYTHON: '1'

jobs:
  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest/toolchain agreement
        run: python3 -c "import tomllib; assert tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['rust-version'] == '1.92'"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.92.0'
      - name: Check every target at the declared minimum
        run: cargo check --workspace --all-targets
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Headless core, no GUI libraries: all three desktop platforms so testers get a build
        # signal everywhere the CLI is meant to run.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-${{ matrix.os }}
      - name: cargo xtask ci
        run: cargo xtask ci
      - name: Router geometry acceptance boundaries
        run: python3 tools/oracle/test_route_geometry.py
      - name: Build panic-injection test binary
        run: cargo build -p misterdiagram-cli --features test-panic-injection
      - name: MCP panic and framing recovery
        env:
          MISTERDIAGRAM_CLI: target/debug/misterdiagram${{ runner.os == 'Windows' && '.exe' || '' }}
          MISTERDIAGRAM_TEST_INJECTIONS: '1'
        run: python3 tools/mcp/test_recovery.py
      - name: Build test binary
        run: cargo build --release -p misterdiagram-cli
      - name: MCP large-stencil stdio regressions
        env:
          MISTERDIAGRAM_CLI: target/release/misterdiagram${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/mcp/test_stencils.py
          python3 tools/mcp/test_memory.py
          python3 tools/mcp/test_recovery.py --verify-production
      - name: Archive binary and licences
        id: archive
        run: python3 tools/ci/archive.py
      - name: Upload test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: target/ci-artifacts/*.zip
          retention-days: 30
          if-no-files-found: error
