name: audit

on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Check dependency advisories
        run: cargo audit
