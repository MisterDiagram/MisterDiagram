[package]
name = "misterdiagram-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[[bin]]
name = "misterdiagram"
path = "src/main.rs"

[features]
# Test-only fault injection; never enabled for release artifacts.
test-panic-injection = ["misterdiagram-mcp/test-panic-injection"]

[lints]
workspace = true
[dependencies]
misterdiagram-export.workspace = true
misterdiagram-render.workspace = true
misterdiagram-text.workspace = true
misterdiagram-opc.workspace = true
misterdiagram-vsdx.workspace = true
misterdiagram-corpus = { path = "../misterdiagram-corpus" }
misterdiagram-theme.workspace = true
misterdiagram-engine.workspace = true
misterdiagram-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
[dev-dependencies]
hayro-syntax = { version = "0.7.2", default-features = false, features = ["std", "unsafe"] }
image.workspace = true
zip.workspace = true
misterdiagram-geom.workspace = true
misterdiagram-model.workspace = true
