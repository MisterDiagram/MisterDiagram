[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/MisterDiagram/MisterDiagram"

[workspace.dependencies]
misterdiagram-geom = { path = "crates/geom" }
misterdiagram-color = { path = "crates/color" }
misterdiagram-opc = { path = "crates/opc" }
misterdiagram-sheet = { path = "crates/sheet" }
misterdiagram-model = { path = "crates/model" }
misterdiagram-fonts = { path = "crates/fonts" }
misterdiagram-text = { path = "crates/text" }
misterdiagram-theme = { path = "crates/theme" }
misterdiagram-vsdx = { path = "crates/vsdx" }
misterdiagram-route = { path = "crates/route" }
misterdiagram-render = { path = "crates/render" }
misterdiagram-export = { path = "crates/export" }
misterdiagram-engine = { path = "crates/engine" }
misterdiagram-mcp = { path = "crates/mcp" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
uuid = { version = "1", features = ["v4", "js"] }
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
krilla = { version = "0.8", features = ["pdf"] }
i_overlay = "9"
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
